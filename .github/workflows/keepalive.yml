name: Keepalive

# Prevents GitHub from auto-disabling the scheduled "Update surf data"
# workflow. GitHub disables scheduled workflows after ~60 days with no repo
# commit activity. This job runs weekly and makes a single empty commit
# only when the repo has been idle for 45+ days. Uses no third-party
# actions (only first-party actions/checkout) and grants contents:write so
# the push succeeds.

on:
  schedule:
    # Weekly, Mondays at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Empty commit if repo has been idle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          if [ "$days" -ge 45 ]; then
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push
          else
            echo "Last commit $days days ago; keepalive not needed yet."
          fi
